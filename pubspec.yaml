name: ditonton
description: Ditonton - katalog Movies & TV Series (proyek akhir Menjadi Flutter Developer Expert).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

workspace:
  - core
  - about
  - movie
  - tv

dependencies:
  flutter:
    sdk: flutter
  core:
    path: core
  about:
    path: about
  movie:
    path: movie
  tv:
    path: tv
  get_it: ^9.3.0
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  flutter_bloc: ^9.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
